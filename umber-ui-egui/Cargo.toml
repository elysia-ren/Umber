[package]
name = "umber-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
description = "egui/eframe reference implementation of the UISpec contract (总案 §38 §41.5; visual layer is replaceable, not a contract)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
umber-ui = { path = "../umber-ui" }

# settings-demo 演示后端所需（lib 本体不使用——lib 只依赖 umber-ui）
umber-core = { workspace = true }
umber-credential = { path = "../umber-credential" }
umber-model = { path = "../umber-model" }
umber-protocol = { path = "../umber-protocol" }
umber-provider = { path = "../umber-provider" }
umber-data = { path = "../umber-data" }
umber-credential-os = { path = "../umber-credential-os" }
serde_json = { workspace = true }

[[bin]]
name = "settings-demo"
path = "src/main.rs"
