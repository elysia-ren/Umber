[package]
name = "runtime-ui-egui"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
description = "egui/eframe reference implementation of the UISpec contract (总案 §38 §41.5; visual layer is replaceable, not a contract)"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["default_fonts", "glow", "wayland", "x11"] }
egui = "0.29"
runtime-ui = { path = "../runtime-ui" }

# settings-demo 演示后端所需（lib 本体不使用——lib 只依赖 runtime-ui）
runtime-core = { workspace = true }
runtime-credential = { path = "../runtime-credential" }
runtime-model = { path = "../runtime-model" }
runtime-protocol = { path = "../runtime-protocol" }
runtime-provider = { path = "../runtime-provider" }

[[bin]]
name = "settings-demo"
path = "src/main.rs"
