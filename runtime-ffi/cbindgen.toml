# cbindgen 配置：C 头文件由 Rust 类型生成（总案 §49：Rust 类型是唯一真值）
language = "C"
include_guard = "UMER_H"
pragma_once = true
cpp_compat = true
documentation = true
documentation_style = "doxy"
usize_is_size_t = true

header = """/* Universal Embedded Model Runtime - Stable C ABI (generated by cbindgen).
 *
 * DO NOT EDIT BY HAND. Regenerate with:
 *     cbindgen --config runtime-ffi/cbindgen.toml --crate runtime-ffi -o runtime-ffi/include/umer.h
 *
 * Shape contract: runtime-ffi/src/lib.rs module docs (总案 §41.6 §50).
 * All strings are UTF-8 with explicit length. Ownership of event JSON
 * transfers to the caller on delivery; free it with runtime_string_free.
 */"""

[export]
prefix = ""
include = ["RUNTIME_ABI_MAJOR", "RUNTIME_ABI_MINOR", "UMER_OK", "UMER_ERR_NULL_ARGUMENT",
           "UMER_ERR_ABI_MISMATCH", "UMER_ERR_OPEN_FAILED", "UMER_ERR_INTERNAL",
           "UMER_ERR_NOT_CONFIGURED", "UMER_ERR_CATALOG",
           "UMER_EVENT", "UMER_CLOSED", "UMER_WOULD_BLOCK"]

# C 侧保持 UmerEvent 这个名字（Rust 内部叫 CUmerEvent 以免与 core 类型混淆）
[export.rename]
"CUmerEvent" = "UmerEvent"
"UmerRuntime" = "UmerRuntime"
"UmerStream" = "UmerStream"

[parse]
parse_deps = false
