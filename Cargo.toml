[workspace]
resolver = "2"
members = [
    "runtime-core",
    "runtime-model",
    "runtime-engine",
    "runtime-conformance",
    "runtime-credential",
    "runtime-credential-os",
    "runtime-provider",
    "runtime-protocol",
    "runtime-ui",
    "runtime-ui-egui",
    "runtime-ffi",
    "runtime-data",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
runtime-core = { path = "runtime-core" }
runtime-engine = { path = "runtime-engine" }
runtime-model = { path = "runtime-model" }
