[workspace]
resolver = "2"
members = [
    "umber-core",
    "umber-model",
    "umber-engine",
    "umber-conformance",
    "umber-credential",
    "umber-credential-os",
    "umber-provider",
    "umber-protocol",
    "umber-ui",
    "umber-ui-egui",
    "umber-ffi",
    "umber-data",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"
license = "MIT OR Apache-2.0"

[workspace.dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
umber-core = { path = "umber-core" }
umber-engine = { path = "umber-engine" }
umber-model = { path = "umber-model" }
